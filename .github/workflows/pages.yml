# main に入ったら、docs（プライバシーポリシーなど）と Web 版を GitHub Pages に出す。
# docs は今までと同じ URL（/yomigana-pdf/・/yomigana-pdf/privacy）、Web 版は /yomigana-pdf/app/ に置く。
# 使う前に、リポジトリの Settings → Pages の Source を「GitHub Actions」に変える（今は main の docs/ から出している）
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 出している途中のものは止めず、順に出す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # CI では Git フックを入れない
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
    steps:
      # Action は版の番号ではなくコミットで固定する（Dependabot が更新する）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存を入れる
        run: npm ci
      # 今の Pages（main の docs/ から出す形）と同じく、Jekyll で作る
      - name: docs を作る
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: Web 版を作る
        run: npm run build:web -- --base /yomigana-pdf/app/
      # Jekyll はコンテナの中で動くので、_site の持ち主が root になる
      - name: Web 版を docs の下に置く
        run: sudo cp -r .output/web _site/app
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
